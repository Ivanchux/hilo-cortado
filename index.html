'use strict';
// ════════════════════════════════════════════════════════════════
//  HILO CORTADO · beat 'em up de marionetas
//  Un solo archivo, sin dependencias. Iván Brihuega (Ivanchux).
// ════════════════════════════════════════════════════════════════

// ───────── Constantes y utilidades ─────────
const W = 960, H = 540;          // resolución lógica
const ZMAX = 120;                // profundidad del pasillo de lucha
const FLOOR_Y = 372;             // y de pantalla de los pies en z = 0
const GY = z => FLOOR_Y + z;     // y de pantalla de los pies según profundidad
const DS = z => 0.86 + 0.18 * (z / ZMAX); // escala por profundidad
const DEG = Math.PI / 180, TAU = Math.PI * 2;
const QS = new URLSearchParams(location.search);
const TEST = QS.has('test');
const SERIF = 'Georgia,"Palatino Linotype","Book Antiqua",Palatino,serif';

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sgn = v => v < 0 ? -1 : 1;
const EASE = {
  lin: t => t,
  io: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  out: t => 1 - (1 - t) * (1 - t),
};
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
// rng: simulación (determinista con semilla). frng: solo efectos visuales.
let rng = mulberry32(1);
const rnd = (a = 1, b) => b === undefined ? rng() * a : a + rng() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(rng() * a.length)];
const frng = mulberry32(77);
const fr = (a = 1, b) => b === undefined ? frng() * a : a + frng() * (b - a);
const fpick = a => a[Math.floor(frng() * a.length)];
let brng = mulberry32(5); // bots

function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  if (f < 1) { r *= f; g *= f; b *= f; } else { const k = f - 1; r += (255 - r) * k; g += (255 - g) * k; b += (255 - b) * k; }

}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

// ───────── Entrada: teclado y mando ─────────
const KEYS = [
  { left: ['KeyA'], right: ['KeyD'], up: ['KeyW'], down: ['KeyS'], atk: ['KeyJ'], jump: ['KeyK'], grab: ['KeyL'], spec: ['KeyI'], start: ['Enter', 'Space'] },
  { left: ['ArrowLeft'], right: ['ArrowRight'], up: ['ArrowUp'], down: ['ArrowDown'], atk: ['Comma', 'Numpad1'], jump: ['Period', 'Numpad2'], grab: ['Slash', 'Numpad3'], spec: ['Quote', 'Numpad5'], start: ['NumpadEnter', 'Backslash'] },
];
const PREVENT = new Set(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', 'Slash', 'Quote', 'Comma', 'Period', 'Backslash']);
const Input = {
  keys: new Set(), gp: [],
  init() {
    addEventListener('keydown', e => {
      if (PREVENT.has(e.code)) e.preventDefault();
      if (e.repeat) return;
      this.keys.add(e.code); Snd.unlock(); Game.key(e.code);
    });
    addEventListener('keyup', e => this.keys.delete(e.code));
    addEventListener('blur', () => { this.keys.clear(); if (Game.st === 'play') Game.st = 'paused'; });
    addEventListener('pointerdown', () => Snd.unlock());
  },
  poll() {
    this.gp = [];
    try { if (navigator.getGamepads) for (const g of navigator.getGamepads()) if (g && g.connected) this.gp.push(g); } catch (e) { }
  },
};
const BTN = ['left', 'right', 'up', 'down', 'atk', 'jump', 'grab', 'spec', 'start'];
class Pad {
  constructor(i) {
    this.i = i; this.cur = {}; this.prev = {}; this.last = {}; this.bot = null;
    this.tapD = 0; this.tapT = -99; this.run = false; this.tick = 0; this.any = false;
    for (const b of BTN) { this.cur[b] = false; this.prev[b] = false; this.last[b] = -999; }
  }
  read(tick) {
    let s = {};
    if (this.bot) s = this.bot.out;
    else {
      const k = KEYS[this.i];
      for (const b of BTN) s[b] = k[b].some(c => Input.keys.has(c));
      const g = Input.gp[this.i];
      if (g) {
        const B = n => !!(g.buttons[n] && g.buttons[n].pressed), ax = g.axes[0] || 0, ay = g.axes[1] || 0;
        s.left = s.left || B(14) || ax < -.45; s.right = s.right || B(15) || ax > .45;
        s.up = s.up || B(12) || ay < -.45; s.down = s.down || B(13) || ay > .45;
        s.atk = s.atk || B(2); s.jump = s.jump || B(0); s.grab = s.grab || B(1) || B(5) || B(7);
        s.spec = s.spec || B(3); s.start = s.start || B(9);
      }
      if (this.i === 0 && typeof Touch !== 'undefined' && Touch.on) for (const b of BTN) s[b] = s[b] || !!Touch.state[b];

    }

    if (d && !(d > 0 ? this.prev.right : this.prev.left)) {

      this.tapD = d; this.tapT = tick;
    }
    if (!d) this.run = false;
    this.tick = tick;
  }
  hit(b, win = 7) { return this.tick - this.last[b] <= win; }
  eat(b) { this.last[b] = -999; }
  get mx() { return (this.cur.right ? 1 : 0) - (this.cur.left ? 1 : 0); }
  get mz() { return (this.cur.down ? 1 : 0) - (this.cur.up ? 1 : 0); }
}

// ───────── Sonido sintetizado (Web Audio) ─────────
const Snd = {
  ctx: null, on: true, noise: null, pl: [],

      this.build();

  },
  build() {
    const c = this.ctx;

    const comp = c.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    this.out.connect(comp); comp.connect(c.destination);
    this.sfx = c.createGain(); this.sfx.connect(this.out);
    this.mus = c.createGain(); this.mus.gain.value = 0.3; this.mus.connect(this.out);
    const nb = c.createBuffer(1, c.sampleRate, c.sampleRate), d = nb.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    this.noise = nb;
    // cuerdas pulsadas (Karplus-Strong): la base de todo lo que suena a hilo
    this.pl = [this.ks(220, .996, .5, 1.6), this.ks(110, .995, .5, 1.5), this.ks(440, .985, .5, .5)];
  },
  ks(f, decay, a, dur) {
    const c = this.ctx, sr = c.sampleRate, n = Math.floor(sr * dur), N = Math.round(sr / f);
    const b = c.createBuffer(1, n, sr), d = b.getChannelData(0);
    for (let i = 0; i < N; i++) d[i] = Math.random() * 2 - 1;
    for (let i = N + 1; i < n; i++) d[i] = decay * (a * d[i - N] + (1 - a) * d[i - N - 1]);
    return b;
  },
  env(g, t, a, peak, dur) {
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + dur);
  },
  nz(t, dur, type, f0, q, vol, f1, dest) {
    const c = this.ctx, s = c.createBufferSource(); s.buffer = this.noise;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(f0, t);
    if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur); f.Q.value = q;
    const g = c.createGain(); this.env(g, t, .003, vol, dur);
    s.connect(f); f.connect(g); g.connect(dest || this.sfx); s.start(t, Math.random() * .5); s.stop(t + dur + .05);
  },
  osc(t, type, f0, f1, dur, vol, dest) {
    const c = this.ctx, o = c.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);

  pluck(i, rate, vol, t, dest) {
    const c = this.ctx, s = c.createBufferSource(); s.buffer = this.pl[i]; s.playbackRate.value = rate;

  },
  play(name, p = 1) {
    if (!this.ctx || !this.on || this.ctx.state !== 'running') return;

      case 'heavy': this.osc(t, 'sine', 150, 38, .24, .8); this.nz(t, .2, 'lowpass', 900, .7, .7, 180); this.nz(t, .05, 'bandpass', 2400, 1, .35); break;

      case 'whoosh': this.nz(t, .13, 'bandpass', 450 * p, 2, .16, 2000 * p); break;
      case 'land': this.osc(t, 'sine', 115, 42, .13, .5); this.nz(t, .1, 'lowpass', 650, .7, .35); break;

      case 'pick': this.pluck(0, 2, .4); this.pluck(0, 3, .3, t + .07); break;

      case 'metal': this.osc(t, 'square', 1900, 1250, .07, .1); this.osc(t, 'sine', 2700, 2500, .3, .13); this.nz(t, .05, 'highpass', 4200, 1, .3); break;
      case 'fire': this.nz(t, .45, 'lowpass', 1500, .5, .26, 280); break;
      case 'grab': this.nz(t, .05, 'bandpass', 900, 1, .3); this.osc(t, 'sine', 320, 170, .07, .25); break;
      case 'step': this.osc(t, 'sine', 190 * p, 95, .035, .07); break;

// Música de feria: arpegios pulsados en re menor (i–VI–VII–V)
const D3 = 146.83, nf = s => D3 * Math.pow(2, s / 12);
const PROG = [[0, 3, 7], [-4, 0, 3], [-2, 2, 5], [-5, -1, 2]];
const SONGS = {
  title: { bpm: 80, arp: [0, 2, 1, 2, 0, 2, 1, 2], mel: [[12, null, null, 15, 14, null, 12, null], [10, null, null, 14, 12, null, 10, null], [9, null, 12, null, 14, null, 12, null], [13, null, null, null, 9, null, null, null]], perc: 0 },
  act: { bpm: 108, arp: [0, 1, 2, 1, 0, 1, 2, 1], mel: [[12, 12, 15, null, 14, 12, 10, null], [10, 10, 14, null, 12, 10, 9, null], [9, 12, 14, null, 17, 14, 12, null], [13, 12, 10, 9, 7, null, 9, null]], perc: 1 },
  boss: { bpm: 138, arp: [0, 2, 1, 2, 0, 2, 1, 2], mel: [[12, 15, 12, 15, 14, 12, 10, 12], [10, 14, 10, 14, 12, 10, 9, 10], [9, 12, 14, 12, 17, 14, 12, 14], [13, 16, 13, 9, 13, 16, 19, 16]], perc: 2 },

  on: true, playing: null, next: 0, step: 0,
  start(name) { if (this.playing === name) return; this.playing = name; this.step = 0; if (Snd.ctx) this.next = Snd.ctx.currentTime + .1; },
  stop() { this.playing = null; },
  tick() {
    const c = Snd.ctx; if (!c || !this.playing || !Snd.on || !this.on || c.state !== 'running') return;

    if (this.next < c.currentTime) this.next = c.currentTime + .05;
    while (this.next < c.currentTime + .25) { this.note(S, this.step, this.next); this.next += dur; this.step++; }
  },
  note(S, st, t) {

function fk(b, p, f) {

  a1 = L + p[AB1]; a2 = a1 + p[AB2];
  o.eB = [sx + S(a1) * f * b.ua, sy + C(a1) * b.ua]; o.hB = [o.eB[0] + S(a2) * f * b.la, o.eB[1] + C(a2) * b.la];
  a1 = p[LF1]; a2 = a1 + p[LF2];
  o.kF = [hx + S(a1) * f * b.ul, hy + C(a1) * b.ul]; o.fF = [o.kF[0] + S(a2) * f * b.ll, o.kF[1] + C(a2) * b.ll]; o.fFa = a2;
  a1 = p[LB1]; a2 = a1 + p[LB2];
  o.kB = [hx + S(a1) * f * b.ul, hy + C(a1) * b.ul]; o.fB = [o.kB[0] + S(a2) * f * b.ll, o.kB[1] + C(a2) * b.ll]; o.fBa = a2;
  o.wa = p[WP];
  const r = p[ROT] * f; o.rot = r;
  if (r) {
    const cr = C(r), sr = S(r);
    for (const k of ['neck', 'sh', 'hc', 'eF', 'hF', 'eB', 'hB', 'kF', 'fF', 'kB', 'fB']) {

}

function drawTorso(g, k, b, pal, look, f) {

  if (pal.apron) { g.fillStyle = pal.apron; g.strokeStyle = shade(pal.apron === '#fff3dc' ? '#c8b89a' : pal.apron, .6); g.lineWidth = 1.2; g.beginPath(); g.moveTo(hx + ux * .7 + vx * ws * .9, hy + uy * .7 + vy * ws * .9); g.lineTo(hx - ex * L * .5 + vx * wt * 1.25, hy - ey * L * .5 + vy * wt * 1.25); g.lineTo(hx - ex * L * .5 + vx * wt * .1, hy - ey * L * .5 + vy * wt * .1); g.lineTo(hx + ux * .7 + vx * ws * .1, hy + uy * .7 + vy * ws * .1); g.closePath(); g.fill(); g.stroke(); }

}

// Hilos y cruceta
// mano cercana de quien agarra, en pantalla
function handScreen(h, camX) {
  if (!h.kin) return null; const s = h.sc * DS(h.z);
  return [h.x - camX + h.kin.hF[0] * s, GY(h.z) - h.y * DS(h.z) + h.kin.hF[1] * s];
}
function drawStrings(g, e, X, Y, S, k, camX, xf) {
  const look = e.look, f = e.facing, boss = e.T.boss && e.tk === 'titiritero';
  const grip = e.heldBy && e.heldBy.kind === 'p' && (e.st === 'held' || e.st === 'swung') ? handScreen(e.heldBy, camX) : null;
  const strC = look.str || STR_ENEMY, cruC = look.cru || CRU_ENEMY;
  const cx = e.cx - camX, cy = e.cy, bar = (boss ? 46 : 30) * e.sc, tilt = e.crTilt;
  const ct = Math.cos(tilt), st = Math.sin(tilt);
  const P0 = (dx, dy) => [cx + dx * ct - dy * st, cy + dx * st + dy * ct];
  const anchors = [P0(0, 4), P0(f * bar, 0), P0(-f * bar, 0), P0(f * bar * .45, 13), P0(-f * bar * .45, 13)];
  let body = [k.top, k.hF, k.hB, k.kF, k.kB].map(q => [X + q[0] * S, Y + q[1] * S]);
  if (xf) body = body.map(xf);
  const lw = boss ? 2.6 : (e.kind === 'p' ? 1.3 : 1.3);
  const sway = Math.sin((e.t + e.id * 7) * .05) * 4;
  g.lineCap = 'round';
  for (let i = 0; i < 5; i++) {
    const s = e.hp[i], A = anchors[i], B = body[i];
    if (!s.cut && grip) {
      // agarrado por los hilos: pasan por el puño de quien lo sujeta
      g.strokeStyle = strC; g.lineWidth = lw; g.beginPath(); g.moveTo(A[0], A[1]); g.lineTo(grip[0], grip[1]); g.lineTo(B[0], B[1]); g.stroke();
    } else if (!s.cut) {
      const mx = (A[0] + B[0]) / 2 + sway + (e.x - e.cx) * .15, my = (A[1] + B[1]) / 2;
      g.strokeStyle = strC; g.lineWidth = lw; g.globalAlpha = s.v / s.max < .35 ? .55 + .45 * Math.abs(Math.sin(e.t * .3)) : 1;
      g.beginPath(); g.moveTo(A[0], A[1]); g.quadraticCurveTo(mx, my, B[0], B[1]); g.stroke(); g.globalAlpha = 1;
      if (e.kind !== 'p') { g.strokeStyle = boss ? 'rgba(255,255,255,.14)' : 'rgba(255,236,210,.16)'; g.lineWidth = boss ? 1 : .6; g.stroke(); }
    } else {
      const ct2 = s.cutT, full = Math.hypot(B[0] - A[0], B[1] - A[1]);
      const len = Math.max(10, full * .5 * Math.max(0, 1 - ct2 / 14)) * (e.alive ? 1 : 1);
      g.strokeStyle = strC; g.lineWidth = lw; g.beginPath(); g.moveTo(A[0], A[1]);
      for (let j = 1; j <= 6; j++) { const q = j / 6; g.lineTo(A[0] + Math.sin(q * 9 + ct2 * .4 + i) * 5 * q, A[1] + len * q); }
      g.stroke();
      if (ct2 < 400) { g.beginPath(); g.moveTo(B[0], B[1]); g.quadraticCurveTo(B[0] + 4, B[1] + 6, B[0] + 1, B[1] + 13); g.stroke(); }
    }
  }
  // cruceta
  g.save(); g.translate(cx, cy); g.rotate(tilt);
  g.strokeStyle = shade(cruC, .55); g.lineWidth = boss ? 9 : 6.5; g.beginPath(); g.moveTo(-bar - 3, 0); g.lineTo(bar + 3, 0); g.stroke();
  g.strokeStyle = cruC; g.lineWidth = boss ? 6 : 4; g.stroke();
  g.strokeStyle = shade(cruC, .55); g.lineWidth = boss ? 7 : 5; g.beginPath(); g.moveTo(-bar * .5, 13); g.lineTo(bar * .5, 13); g.stroke();
  g.strokeStyle = cruC; g.lineWidth = boss ? 4.5 : 3; g.stroke();
  g.strokeStyle = shade(cruC, .55); g.lineWidth = boss ? 7 : 5; g.beginPath(); g.moveTo(0, -8); g.lineTo(0, 14); g.stroke();
  g.strokeStyle = cruC; g.lineWidth = boss ? 4.5 : 3; g.stroke();
  if (e.kind === 'p') { g.fillStyle = look.str; g.fillRect(-3, -3, 6, 6); }
  g.restore();
}

// Bufanda / capa: cadena de puntos con inercia (solo visual)
function chainStep(e, root, n, seg, grav) {
  if (!e.chain) { e.chain = []; for (let i = 0; i < n; i++) e.chain.push([root[0], root[1] + i * seg, root[0], root[1] + i * seg]); }
  const c = e.chain; c[0][0] = root[0]; c[0][1] = root[1];
  for (let i = 1; i < n; i++) {
    const p = c[i], vx = (p[0] - p[2]) * .86, vy = (p[1] - p[3]) * .86;
    p[2] = p[0]; p[3] = p[1]; p[0] += vx - e.facing * .25; p[1] += vy + grav;
  }
  for (let it = 0; it < 2; it++) for (let i = 1; i < n; i++) {
    const a = c[i - 1], b = c[i], dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1, k = (d - seg) / d;
    b[0] -= dx * k; b[1] -= dy * k;
  }
  return c;
}

function drawPuppet(g, e, X, Y, S, camX) {
  const b = e.body, look = e.look, f = e.facing;
  const pal = e.flash > 0 ? WHITE_PAL : (e.charT > 0 ? BURN_PAL : look.pal);
  const k = fk(b, e.pose, f); e.kin = k;
  // capa del titiritero (detrás)
  if (look.cape) {
    const nk = [X + k.neck[0] * S, Y + k.neck[1] * S];
    const c = chainStep(e, nk, 6, 14 * S, 1.2);
    g.fillStyle = pal.cape || '#140e12'; g.beginPath(); g.moveTo(nk[0] + 8 * S * f, nk[1]);
    for (let i = 1; i < c.length; i++) g.lineTo(c[i][0] - f * (6 + i * 3) * S, c[i][1]);
    for (let i = c.length - 1; i > 0; i--) g.lineTo(c[i][0] + f * (2 + i * 1.5) * S, c[i][1]);
    g.closePath(); g.fill();
  }
  g.save(); g.translate(X + (e.shk || 0), Y); g.scale(S, S); g.lineCap = 'round'; g.lineJoin = 'round';
  const armB = e.hp[2].cut, legF = e.hp[3].cut;
  // brazo lejano
  stick(g, k.sh, k.eB, b.wa, pal.shirtD, pal.shirtE || pal.edge);
  stick(g, k.eB, k.hB, b.wa * .85, pal.woodD, pal.edge); dot(g, k.hB, b.wa * .62, pal.woodD); dot(g, k.eB, b.wa * .32, pal.peg);
  // pierna lejana
  stick(g, k.hip, k.kB, b.wl, pal.pantsD, pal.pantsE); stick(g, k.kB, k.fB, b.wl * .78, pal.woodD, pal.edge);
  foot(g, k.fB, k.fBa, f, b.wl * 2.1, b.wl * .9, shade(pal.boots, .8), '#120a06'); dot(g, k.kB, b.wl * .3, pal.peg);
  drawTorso(g, k, b, pal, look, f);
  // pierna cercana
  stick(g, k.hip, k.kF, b.wl, pal.pants, pal.pantsE); stick(g, k.kF, k.fF, b.wl * .78, pal.wood, pal.edge);
  foot(g, k.fF, k.fFa, f, b.wl * 2.1, b.wl * .9, pal.boots, '#120a06'); dot(g, k.kF, b.wl * .32, pal.peg); dot(g, k.hip, b.wl * .35, pal.peg);
  drawHead(g, k, b, pal, look, f, e);
  // brazo cercano y arma
  stick(g, k.sh, k.eF, b.wa, pal.shirt, pal.shirtE || pal.edge);
  stick(g, k.eF, k.hF, b.wa * .85, pal.wood, pal.edge); dot(g, k.eF, b.wa * .34, pal.peg); dot(g, k.sh, b.wa * .38, pal.peg);
  if (e.weapon && !e.hp[1].cut) drawWeapon(g, e.weapon.type, k.hF, k.wa, f, e.t, S);
  dot(g, k.hF, b.wa * .66, pal.wood);
  g.restore();
  // bufanda de Clavija (delante, ondeando)
  if (look.scarf) {
    const nk = [X + k.neck[0] * S, Y + k.neck[1] * S];
    const c = chainStep(e, nk, 5, 7 * S, .55);
    g.strokeStyle = look.scarf; g.lineCap = 'round';
    for (let i = 1; i < c.length; i++) { g.lineWidth = (6 - i) * S; g.beginPath(); g.moveTo(c[i - 1][0], c[i - 1][1]); g.lineTo(c[i][0], c[i][1]); g.stroke(); }
    dot(g, nk, 4.5 * S, look.scarf);
  }
  void armB; void legF;
  return k;
}

// Muñeco desplomado (verlet): se dibuja como un montón de piezas
function drawRag(g, e, camX) {
  const R = e.rag, pal = e.charT > 0 ? BURN_PAL : e.look.pal, b = e.body, s = e.sc * DS(e.z);

  const [hip, neck, head, eF, hF, eB, hB, kF, fF, kB, fB] = R.p.map((_, i) => P(i));
  g.save(); g.lineCap = 'round';
  const st = (a, c, w, col, ed) => stick(g, a, c, w * s, col, ed);
  st(neck, eB, b.wa, pal.shirtD, pal.edge); st(eB, hB, b.wa * .85, pal.woodD, pal.edge);

  g.restore();

function genScene(theme, len, seed) {
  const r = mulberry32(seed), R = (a, b) => a + r() * (b - a);
  const S = { theme, far: [], mid: [], near: [], stars: [], deco: [] };
  for (let i = 0; i < 70; i++) S.stars.push({ x: R(0, W + 300), y: R(40, 230), s: R(1, 3) });
  const span = p => len * p + W + 200;
  if (theme === 'bosque') {
    for (let x = -200; x < span(.25); x += R(150, 230)) S.far.push({ x, h: R(40, 95), w: R(170, 280) });
    for (let x = -100; x < span(.5); x += R(60, 110)) S.mid.push({ x, h: R(110, 190), w: R(40, 70), t: r() });
    for (let x = 60; x < span(.82); x += R(230, 360)) S.near.push({ x, h: R(170, 230), w: R(90, 140), t: r() });
  } else if (theme === 'ciudad') {
    const cols = ['#6a4a5a', '#5a5a72', '#7a5a4a', '#4e5a4e', '#6e5a3e'];
    for (let x = -100; x < span(.25); x += R(60, 110)) S.far.push({ x, h: R(70, 150), w: R(50, 100), c: cols[Math.floor(r() * 5)], roof: r() });
    for (let x = 0; x < span(.55); x += R(170, 260)) S.mid.push({ x, h: R(150, 210), w: R(110, 160), c: cols[Math.floor(r() * 5)], t: r() });
    for (let x = 100; x < span(.82); x += R(300, 420)) S.near.push({ x, h: R(30, 70), t: r() });
  } else {
    for (let x = 0; x < span(.2); x += R(180, 260)) S.far.push({ x, w: R(40, 60), h: R(110, 150) });
    for (let x = 0; x < span(.45); x += R(220, 320)) S.mid.push({ x, h: R(140, 200), t: r() });
    for (let x = 80; x < span(.78); x += R(160, 260)) S.near.push({ x, h: R(120, 240), t: r(), k: r() < .3 ? 'polea' : r() < .6 ? 'saco' : 'cuerda' });
  }
  return S;
}

    return this.state();
  },
  step(n = 1) { for (let i = 0; i < n; i++) { Game.frame(); if (Game.arena && Game.st === 'play') { Game.locked = true; Game.secIdx = 99; const al = World.F.filter(f => f.team === 1 && f.alive).length; if (al < (Game.arena.keep || 0)) Game.spawn(pick(Game.arena.pool || ['comparsa']), pick(['R', 'L', 'T'])); } } return this.state(); },
  draw() { render(); },
  state() {
    return {
      st: Game.st, act: Game.actIdx, sec: Game.secIdx, wave: Game.waveIdx, locked: Game.locked, cam: Math.round(Game.cam.x), tick: World.tick, time: Game.time,
      players: Game.players.map(p => ({ name: p.name, st: p.st, alive: p.alive, lives: p.lives, out: p.out, x: Math.round(p.x), z: Math.round(p.z), hp: p.hp.map(s => s.cut ? 'X' : Math.round(s.v)), score: p.score, weapon: p.weapon && p.weapon.type })),
      enemies: World.F.filter(f => f.team === 1 && f.alive).map(e => ({ t: e.tk, st: e.st, x: Math.round(e.x), hp: e.hp.map(s => s.cut ? 'X' : Math.round(s.v)), tok: e.ai.tok })),
      stats: STATS, items: World.IT.map(i => i.type), props: World.PR.filter(p => !p.broken).length, logs: (Game.allLogs || []).length,
    };
  },
  key(code, down) { if (down) { Input.keys.add(code); Game.key(code); } else Input.keys.delete(code); },
  // pruebas guiadas: colocar enemigos y pulsar botones a mano
  place(type, dx, dz, passive) {
    const p = Game.players[0], e = mkFighter('e', type, p.x + dx, clamp(p.z + (dz || 0), 0, ZMAX)); e.facing = dx > 0 ? -1 : 1; e.inView = true; e.cx = e.x;
    if (passive) e.ai.cd = 1e9; World.F.push(e); return e.id;
  },
  passive(on) { for (const e of World.F) if (e.team === 1) e.ai.cd = on ? 1e9 : 0; },
  item(type, dx) { const p = Game.players[0]; mkItem(type, p.x + (dx || 0), p.z); },
  press(i, s) { const pad = Game.pads[i]; if (!pad.bot || pad.bot.skill !== 'manual') pad.bot = { out: {}, skill: 'manual' }; for (const b of BTN) pad.bot.out[b] = s.split('+').includes(b); },
  run(i, seq) { for (const [n, s] of seq) { this.press(i, s); this.step(n); } this.press(i, ''); return this.state(); },
  ent(id) { const e = World.F.find(f => f.id === id); return e && { st: e.st, alive: e.alive, x: Math.round(e.x), hp: e.hp.map(s => s.cut ? 'X' : +s.v.toFixed(1)), weapon: e.weapon && e.weapon.type, heldBy: !!e.heldBy }; },
};

</script>
